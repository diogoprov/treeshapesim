url: https://diogoprov.github.io/treeshapesim/

template:
  bootstrap: 5

reference:
- title: Simulate trees
  desc: Ultrametric trees with separately controlled imbalance and branching times.
  contents:
  - sim_tree_shape
  - sim_tree_target
- title: Target shapes and grids
  desc: Shape statistics, calibration of the parameters and grids of tree shapes.
  contents:
  - tree_shape
  - calibrate_shape
  - shape_params
  - shape_grid
- title: Fit empirical trees
  desc: Estimate the shape parameters of a tree on the scale of the simulations.
  contents:
  - fit_shape
- title: Building blocks
  desc: Topology, internode intervals and their combination.
  contents:
  - rtopology_beta
  - intervals_lineage_rate
  - assign_ages
